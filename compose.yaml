# =============================================================================
# بيئة التطوير المحلية — نفس صورة الإنتاج بالضبط
#
# لماذا Docker محليًا؟
#   اختلاف بيئات الخادم أنتج ثلاثة عيوب في مراجعة سابقة: عيوب تنجح على
#   خادم PHP المدمج وتفشل على Apache. نفس الصورة في كل مكان = لا مفاجآت.
#
# الاستخدام:
#   docker compose up -d --build
#   docker exec light-commerce php bin/console install \
#        --url=http://localhost:8080 --user=admin --pass="كلمة_مرور_قوية"
#   docker exec light-commerce php bin/console icons
#   docker exec light-commerce php bin/console seed:demo
#   docker compose down
#
# ملاحظة: الشيفرة **مربوطة من المضيف** (bind mount) بينما الحالة معزولة
#   في volumes مُسمّاة. الفصل بينهما مقصود:
#
#   • storage/ و app/uploads/ ← volumes مُسمّاة (معزولة عن المضيف)
#     لأن ربطهما من Windows كان يُدخل مسارات Windows داخل local.php
#     فتتعطّل قاعدة البيانات. هنا يبقى الملف داخل الحاوية نظيفًا.
#
#   • بقية المشروع ← bind mount
#     لأن Dockerfile ينفّذ COPY . /var/www/html، فالشيفرة مثبَّتة داخل
#     الصورة عند البناء. بدون هذا الربط، كل تعديل على المضيف يبقى
#     مجهولًا للحاوية حتى إعادة البناء — فتُطوَّر على 1.4.0 وأنت تختبر
#     1.2.0 دون أي رسالة خطأ.
#
#   الترتيب هنا للقراءة فقط: في Docker يربح المسار الأعمق، فيُركَّب
#   volume storage فوق الربط ولا يظهر محتوى مجلد storage على المضيف إطلاقًا.
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: light-commerce
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - storage-data:/var/www/html/storage
      - uploads-data:/var/www/html/app/uploads
    environment:
      TZ: Asia/Beirut
    restart: unless-stopped

volumes:
  storage-data:
  uploads-data: