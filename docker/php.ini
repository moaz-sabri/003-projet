; إعدادات PHP الموحّدة للتطوير والحماية
; مضبوطة لتناسب SQLite والأداء على استضافة عادية

memory_limit = 256M
max_execution_time = 60
post_max_size = 8M
upload_max_filesize = 6M
max_file_uploads = 5

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
error_log = /var/www/html/storage/logs/php-error.log

date.timezone = Asia/Beirut

; ترميز افتراضي
default_charset = "UTF-8"
mbstring.internal_encoding = UTF-8

; أمان الجلسة
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
session.gc_maxlifetime = 43200
session.sid_length = 48
session.sid_bits_per_character = 6

; حدود SQLite
sqlite3.assoc_ime = On

; تحسينات
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; تعطيل الدوال الخطرة غير المطلوبة
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,show_source