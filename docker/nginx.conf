user  nginx;
worker_processes  auto;
error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 8M;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml application/manifest+json;

    # لا تُسجّل مسارات رموز QR المميزة (تحتوي رموز متابعة الطلبات)
    log_format safe '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status';

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/html;
        index index.php;

        charset utf-8;

        # ------------------------- ترويسات الأمان -------------------------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ------------------------- مسارات محظورة -------------------------
        location ~ ^/(src|storage|bin|tests|tools|docs|docker|setup)(/|$) {
            return 404;
        }
        location ~ /\. { return 404; }
        location ~* \.(md)$ { return 404; }

        # ------------------------- روابط موحّدة -------------------------
        # الرابط القديم /app/index.html لم يعد يظهر: يوجّه إلى الجذر.
        # $is_args$args تُضاف تلقائيًا إلى وجهة إعادة التوجيه، فتبقى ?loc=CODE
        # و?t=TOKEN في رموز QR التي طُبعت قبل هذا التحديث.
        location = /app/index.html { return 301 /$is_args$args; }
        location = /app/          { return 301 /$is_args$args; }

        # ------------------------- واجهة API -------------------------
        location = /api/index.php {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root/api/index.php;
            fastcgi_param HTTP_PROXY "";
            fastcgi_read_timeout 60s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # ------------------------- لوحة الإدارة -------------------------
        location = /admin/index.php {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root/admin/index.php;
            fastcgi_param HTTP_PROXY "";
        }

        location = /admin {
            return 301 /admin/;
        }

        # ------------------------- الصور المرفوعة -------------------------
        # منع تنفيذ أي سكربت داخل مجلد الرفع
        location ~* ^/app/uploads/.*\.(php|phtml|phar|cgi|pl|py|sh)$ {
            return 403;
        }
        location /app/uploads/ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # ------------------------- ملفات PHP الأخرى -------------------------
        location ~ \.php$ {
            return 404;
        }

        # ------------------------- ملفات الواجهة -------------------------
        # الجذر وكل المسارات النظيفة (/cart، /checkout، /order/...) تُقدَّم من
        # index.php واحد، وهو من يحسب المسارات المطلقة لملفات الواجهة.
        location = / {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTP_PROXY "";
        }

        location = /index.php {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTP_PROXY "";
        }

        # ملفات الواجهة الثابتة: ذاكرة وسيط.cache لمدة أسبوع
        # (وسمة ?v= على الملفات هي ما يُبطل الكاش عند تحديث القالب)
        location ~* \.(css|js|svg|png|jpg|jpeg|webp|gif|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }

        # تطبيق صفحة واحدة: أي مسار غير موجود يصل إلى index.php.
        # أما المسارات التي تبدو كملفات (صورة أو سكربت مفقود) فيردّ عليها
        # index.php بحالة 404 بدل صفحة HTML، حتى لا تختفي أخطاء 404 الحقيقية.
        location / {
            try_files $uri $uri/ @shop;
        }

        location @shop {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTP_PROXY "";
        }
    }
}