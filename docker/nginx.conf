user  nginx;
worker_processes  auto;
error_log  /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 8M;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml application/manifest+json;

    # لا تُسجّل مسارات رموز QR المميزة (تحتوي رموز متابعة الطلبات)
    log_format safe '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status';

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/html;
        index app/index.html index.php;

        charset utf-8;

        # ------------------------- ترويسات الأمان -------------------------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ------------------------- مسارات محظورة -------------------------
        location ~ ^/(src|storage|bin|tests|docker|setup)(/|$) {
            return 404;
        }
        location ~ /\. { return 404; }

        # ------------------------- واجهة API -------------------------
        location = /api/index.php {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root/api/index.php;
            fastcgi_param HTTP_PROXY "";
            fastcgi_read_timeout 60s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # ------------------------- لوحة الإدارة -------------------------
        location = /admin/index.php {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root/admin/index.php;
            fastcgi_param HTTP_PROXY "";
        }

        location = /admin {
            return 301 /admin/;
        }

        # ------------------------- الصور المرفوعة -------------------------
        # منع تنفيذ أي سكربت داخل مجلد الرفع
        location ~* ^/app/uploads/.*\.(php|phtml|phar|cgi|pl|py|sh)$ {
            return 403;
        }
        location /app/uploads/ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # ------------------------- ملفات PHP الأخرى -------------------------
        location ~ \.php$ {
            return 404;
        }

        # ------------------------- ملفات الواجهة -------------------------
        # جذر الموقع: إعادة توجيه صريحة إلى /app/index.html
        #
        # لماذا إعادة توجيه وليس خدمة داخلية؟ المسارات في صفحة التطبيق نسبية
        # (js/api.js)، فلو خُدمت الصفحة على / لأصبحت /js/api.js وفشل تحميلها.
        # هذا ما يفعله Apache عبر DirectoryIndex (إعادة توجيه 301).
        location = / {
            # $http_host يحافظ على النطاق والمنفذ كما وصلهما المتصفح.
            # بدونه يُبني nginx العنوان من إعدادات الخادم فيظهر
            # "http://localhost/..." حتى لو الموقع على منفذ أو نطاق آخر.
            return 302 $scheme://$http_host/app/index.html;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        location ~* \.(css|js|svg|png|jpg|jpeg|webp|gif|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }

        # لا fallback إلى index.html: التطبيق يستخدم توجيهًا بالـ hash
        # (#/cart) فيكفيه تحميل الصفحة مرة واحدة.
        # Fallback كان يحوّل أي ملف مفقود (صورة أو JS) إلى HTML، فيخفي
        # أخطاء 404 الحقيقية ويجعل المتصفح يشتكي من نوع المحتوى.
    }
}