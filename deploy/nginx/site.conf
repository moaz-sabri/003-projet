# =============================================================================
# إعداد nginx لتشغيل القالب على خادم مباشر (خارج Docker)
# =============================================================================
#
# هذا الملف هو المرجع الوحيد لحماية المشروع. لا ملفات .htaccess في القالب،
# ولا دعم لـ Apache: كل قاعدة هنا، وكل ما يحمي `storage/` و `src/`
# إن هو مبنيّ عليها. ملف حاوية Docker (docker/nginx.conf) نسخة مطابقة
# منه، و`tests/suites/deploy.php` يتحقق من تطابقهما آليًا — فلو عُدّل أحدهما
# دون الآخر فشل الاختبار بدل أن يفترق السلوك في الإنتاج.
#
# ------------------------------------------------------------------
# التركيب
# ------------------------------------------------------------------
# ١) انسخ محتويات `dist/` إلى جذر موقعك (مثلاً /var/www/html).
# ٢) انسخ هذا الملف إلى /etc/nginx/sites-available/light-commerce
# ٣) عدّل هذه الأسطر فقط:
#       server_name        نطاقك
#       root               جذر موقعك
#       fastcgi_pass       مسار مقبس php-fpm أو منفذ الاستماع
# ٤) اربطه وفعّل:
#       ln -s /etc/nginx/sites-available/light-commerce \
#             /etc/nginx/sites-enabled/light-commerce
#       rm -f /etc/nginx/sites-enabled/default
#       nginx -t && systemctl reload nginx
#
# ------------------------------------------------------------------
# php-fpm
# ------------------------------------------------------------------
# يجب أن يعمل pool المستخدم بمستخدم www-data ومجلداته القابلة للكتابة:
#       storage/  و  app/uploads/  ← 775 ومملوكة لـ www-data
#   chown -R www-data:www-data storage app/uploads
#   chmod -R 775 storage app/uploads
#   chmod 640 storage/config/local.php
#
# ملاحظة على المقبس: السطر أدناه مضبوط على 127.0.0.1:9000 وهو المنفذ
# الافتراضي في most توزيعات Debian/Ubuntu. إن كان poolك يستمع على مقبس
# unix، غيّر fastcgi_pass إلى:
#       fastcgi_pass unix:/run/php/php8.3-fpm.sock;
# ثم أضف في php-fpm.conf:
#       listen.owner = www-data
#       listen.group = www-data
# (بلا ذلك سيreply الخادم 403 على كل طلب despite أن PHP يعمل.)
# =============================================================================

server {
    listen 80;
    listen [::]:80;

    # HTTPS: فعّل ما يلي بعد تركيب الشهادة، وأبقِ الباقي كما هو.
    # listen 443 ssl http2;
    # server_name example.com;
    # ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    server_name _;

    root /var/www/html;
    index index.php;

    charset utf-8;
    server_tokens off;
    client_max_body_size 8M;

    access_log /var/log/nginx/light-commerce.access.log;
    error_log  /var/log/nginx/light-commerce.error.log warn;

    # ---------------------------------------------------------------
    # أنواع يضيفها القالب
    # ---------------------------------------------------------------
    types {
        application/manifest+json  webmanifest;
    }

    # ---------------------------------------------------------------
    # ترويسات الأمان
    # ---------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---------------------------------------------------------------
    # مسارات محظورة
    # ---------------------------------------------------------------
    # setup/ ليست محجوبة عمدًا: التثبيت الأول يتم عبرها، والعودة إليها
    # بعد تدمير النسخة تتطلّب مفتاحًا لا يعرفه إلا صاحب النسخة.
    location ~ ^/(src|storage|bin|tests|tools|docs|docker|deploy)(/|$) {
        return 404;
    }
    location ~ /\. { return 404; }
    location ~* \.(md)$ { return 404; }

    location ~* \.(sqlite|sqlite-wal|sqlite-shm|db|key|pem|log|ini)$ {
        return 404;
    }
    location ~* (^|/)\.env { return 404; }
    location ~* ^/(composer\.(json|lock)|package(-lock)?\.json)$ { return 404; }

    location ~* \.(zip|tar|gz|tgz|bz2|xz|7z|rar|iso|sql|dump)$ { return 404; }

    # ---------------------------------------------------------------
    # روابط موحّدة (301)
    # ---------------------------------------------------------------
    location = /app/index.html { return 301 /$is_args$args; }
    location = /app/          { return 301 /$is_args$args; }
    location = /admin { return 301 /admin/; }
    location = /setup { return 301 /setup/; }

    # ---------------------------------------------------------------
    # صفحة التهيئة
    # ---------------------------------------------------------------
    location = /setup/index.php {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/setup/index.php;
        fastcgi_param HTTP_PROXY "";
    }

    # ---------------------------------------------------------------
    # رابط التدمير الطارئ
    # ---------------------------------------------------------------
    # لا يُخدَم إلّا بمفتاح سرّي وُلد عند التهيئة، ويردّ 404 لكل طلب آخر،
    # وحذف storage/config/emergency.key يُبطله. التدمير نفسه يمرّ بـ
    # InstanceService (نسخة أمان إجبارية قبل أي حذف).
    location = /emergency.php {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/emergency.php;
        fastcgi_param HTTP_PROXY "";
    }

    # ---------------------------------------------------------------
    # واجهة API
    # ---------------------------------------------------------------
    location = /api/index.php {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/api/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # ---------------------------------------------------------------
    # لوحة الإدارة
    # ---------------------------------------------------------------
    location = /admin/index.php {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/admin/index.php;
        fastcgi_param HTTP_PROXY "";
    }

    # ---------------------------------------------------------------
    # الصور المرفوعة
    # ---------------------------------------------------------------
    # منع تنفيذ أي سكربت داخل مجلد الرفع — القاعدة الوحيدة التي
    # كانت تفرضها app/uploads/.htaccess قبل حذفه.
    location ~* ^/app/uploads/.*\.(php|phtml|phar|cgi|pl|py|sh)$ {
        return 403;
    }
    location /app/uploads/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        autoindex off;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------
    # بقية ملفات PHP — أي شيء خارج القوائم أعلاه مرفوض
    # ---------------------------------------------------------------
    location ~ \.php$ {
        return 404;
    }

    # ---------------------------------------------------------------
    # الجذر وملفات الواجهة
    # ---------------------------------------------------------------
    location = / {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # تطبيق صفحة واحدة: أي مسار غير موجود يصل إلى index.php.
    # أما المسارات التي تبدو كملفات (صورة أو سكربت مفقود) فيردّ عليها
    # index.php بحالة 404 بدل صفحة HTML، حتى لا تختفي أخطاء 404 الحقيقية.
    location / {
        try_files $uri $uri/ @shop;
    }

    location @shop {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
    }
}
